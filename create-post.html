<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRAIL SYNC - สร้างโพสต์ไปเดินป่า</title>
  <link rel="stylesheet" href="style2.css">
  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- ===== HEADER / NAVBAR ===== -->
  <header class="navbar">
    <div class="logo">
        <img src="image/Screenshot_2026-09-16_205641-removebg-preview.png" alt="Logo Icon" class="logo-icon-img">
      <span>TRAIL <span class="highlight">SYNC</span></span>
    </div>
    <nav class="nav-links">
      <a href="index.html">หน้าแรก</a>
      <a href="#">ยอดนิยม</a>
      <a href="create-post.html" class="active">สร้างทริปเอง</a>
      <a href="chat.html">แชทกลุ่ม</a>
    </nav>
    <div class="user-profile">
      <i class="fa-regular fa-circle-user"></i>
    </div>
  </header>

  <!-- ===== MAIN FORM CONTAINER ===== -->
  <main class="container form-container">
    <h1 class="page-title">ไปเดินป่ากัน....</h1>

    <form class="post-form" id="createPostForm">
      
      <!-- Inputs Grid (2 คอลัมน์) -->
      <div class="form-grid">
        <!-- 1. ช่องเลือกจังหวัด -->
        <div class="form-group">
            <label for="province">จังหวัด</label>
            <select id="province" name="province" required>
            <option value="" disabled selected>เลือกจังหวัด</option>
            <option value="เชียงใหม่">เชียงใหม่</option>
            <option value="เลย">เลย</option>
            <option value="อุตรดิตถ์">อุตรดิตถ์</option>
            <option value="กาญจนบุรี">กาญจนบุรี</option>
            <option value="น่าน">น่าน</option>
            <option value="ตาก">ตาก</option>
            </select>
        </div>

        <!-- 2. ช่องเลือกสถานที่ (เปลี่ยนเป็น select) -->
        <div class="form-group">
            <label for="location">สถานที่</label>
            <select id="location" name="location" disabled required>
            <option value="" disabled selected>กรุณาเลือกจังหวัดก่อน</option>
            </select>
        </div>

        <div class="form-group">
            <label for="date">วัน/เดือน/ปี</label>
            <!-- เปลี่ยน type เป็น "date" เพื่อให้แสดงปฏิทินเลือกวันที่ -->
            <input type="date" id="date" name="date" required>
        </div>

        <div class="form-group">
          <label for="people">จำนวนคนเดิน</label>
          <input type="text" id="people" name="people" required>
        </div>
      </div>
      <script>
        // 1. รวบรวมข้อมูลสถานที่เดินป่า แยกตามจังหวัด
        const locationData = {
            "เชียงใหม่": ["ดอยอินทนนท์", "กิ่วแม่ปาน", "ดอยหลวงเชียงดาว", "ดอยค้ำฟ้า", "ม่อนจ็อด"],
            "เลย": ["ภูกระดึง", "ภูหลวง", "ภูเรือ", "ภูป่าเปาะ"],
            "อุตรดิตถ์": ["ภูสอยดาว", "วนอุทยานต้นสักใหญ่"],
            "กาญจนบุรี": ["เขาช้างเผือก", "สันหนอกวัว", "น้ำตกเอราวัณ", "เขากะโหลก"],
            "น่าน": ["ดอยเสมอดาว", "ปัว", "ดอยภูขา", "สันเจริญ"],
            "ตาก": ["ดอยสอยมาลัย", "ดอยทูเล", "น้ำตกทีโลซู (อุ้มผาง)", "ดอยหลวงตาก"]
        };

        const provinceSelect = document.getElementById('province');
        const locationSelect = document.getElementById('location');

        // 2. เมื่อมีการเปลี่ยนจังหวัด
        provinceSelect.addEventListener('change', function() {
            const selectedProvince = this.value;
            
            // ล้างค่าสถานที่เดิมออกก่อน
            locationSelect.innerHTML = '<option value="" disabled selected>เลือกสถานที่</option>';
            
            // ถ้ามีข้อมูลสถานที่ของจังหวัดที่เลือก
            if (locationData[selectedProvince]) {
            locationSelect.disabled = false; // เปิดให้กดเลือกสถานที่ได้
            
            // วนลูปนำสถานที่ของจังหวัดนั้นมาใส่ใน dropdown
            locationData[selectedProvince].forEach(function(place) {
                const option = document.createElement('option');
                option.value = place;
                option.textContent = place;
                locationSelect.appendChild(option);
            });
            } else {
            locationSelect.disabled = true;
            }
        });
        </script>

      <!-- Upload Section & Textarea -->
      <div class="content-grid">
        
        <!-- Upload Box -->
        <label class="upload-card" for="image-upload">
          <input type="file" id="image-upload" accept="image/*" hidden>
          <i class="fa-solid fa-cloud-arrow-up"></i>
          <span>อัปโหลดรูป</span>
        </label>

        <!-- Description Textarea -->
        <div class="textarea-card">
          <textarea placeholder="ใส่ข้อความ"></textarea>
          <div class="textarea-tools">
            <button type="button" class="tool-btn" title="แนบไฟล์"><i class="fa-solid fa-cloud-arrow-up"></i></button>
            <button type="button" class="tool-btn" title="บันทึกเสียง"><i class="fa-solid fa-microphone"></i></button>
          </div>
        </div>

      </div>

      <!-- Submit Button -->
      <div class="form-submit-wrapper">
        <button type="submit" class="btn-post">โพสต์</button>
      </div>

    </form>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="logo">
      <img src="image/Screenshot_2026-09-16_205641-removebg-preview.png" alt="Logo Icon" class="logo-icon-img">
      <span>TRAIL <span class="highlight">SYNC</span></span>
    </div>
  </footer>

  <!-- สคริปต์จัดการการกดโพสต์ -->
  <script>
    document.getElementById('createPostForm').addEventListener('submit', function(event) {
      event.preventDefault(); // ป้องกันการรีเฟรชหน้าแบบปกติ
      alert('โพสต์สำเร็จเรียบร้อย!'); // แสดงข้อความแจ้งเตือน (ลบออกได้ถ้าไม่ต้องการ)
      window.location.href = 'index.html'; // ส่งผู้ใช้งานกลับไปที่หน้าแรก
    });
  </script>

</body>
</html>
